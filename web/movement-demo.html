<!DOCTYPE html>
<!--
  Aesthetic Direction: E. 科技冷冽
  Display Font: Outfit | Body Font: DM Sans
  Primary: #818CF8 | Accent: #22D3EE | Bg: #0B1220
  Texture: geometric grid + radial signal glow
  Prototype only: sample records are illustrative and not connected to production data.
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWSDESK｜大佬动向监测 Demo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0b1220;--panel:#111b2d;--panel2:#162238;--line:#283751;--ink:#e5edf8;--muted:#91a0b5;--primary:#818cf8;--accent:#22d3ee;--green:#4ade80;--amber:#fbbf24;--red:#fb7185;--display:'Outfit',sans-serif;--body:'DM Sans','PingFang SC',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);background-color:var(--bg);background-image:radial-gradient(circle at 82% 4%,rgba(34,211,238,.12),transparent 27%),linear-gradient(rgba(129,140,248,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,.035) 1px,transparent 1px);background-size:auto,34px 34px,34px 34px}button,a{font:inherit}.top{height:58px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(11,18,32,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}.brand{font:800 18px var(--display);letter-spacing:.08em;color:var(--amber)}.brand small{display:block;font:500 9px var(--body);letter-spacing:.14em;color:var(--muted)}.top nav{display:flex;gap:4px}.top nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}.top nav button.on{color:var(--accent);border-color:#28546a;background:#102331}.spacer{flex:1}.prototype{color:var(--amber);font-size:10px;border:1px solid #614d1c;background:#231d10;padding:4px 8px}.layout{display:grid;grid-template-columns:220px minmax(440px,1fr) minmax(360px,520px);min-height:calc(100vh - 58px)}.side{padding:22px 14px;border-right:1px solid var(--line);background:rgba(12,20,34,.75)}.side h3,.detail h3{margin:18px 8px 7px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.side h3:first-child{margin-top:0}.filter{width:100%;display:flex;justify-content:space-between;align-items:center;margin:3px 0;padding:8px 9px;color:var(--muted);border:1px solid transparent;background:transparent;text-align:left;cursor:pointer}.filter:hover{color:var(--ink);background:var(--panel)}.filter.on{color:#fff;background:#1a2a42;border-color:#3a5678;box-shadow:inset 3px 0 var(--accent)}.filter em{font-style:normal;font-size:10px;color:#687990}.threshold{padding:8px}.threshold input{width:100%;accent-color:var(--accent)}.threshold div{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.principle{margin-top:26px;padding:12px;border:1px solid #51431d;border-left:3px solid var(--amber);background:#1c190f;color:#c9b77a;font-size:11px;line-height:1.65}.feed{padding:26px 24px;overflow:auto}.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.hero h1{max-width:700px;margin:8px 0 6px;font:800 clamp(34px,4vw,62px)/.98 var(--display);letter-spacing:-.04em}.hero p{max-width:720px;margin:0;color:var(--muted);line-height:1.65}.zero{font:800 64px/1 var(--display);color:var(--red);text-align:right}.zero span{display:block;font:500 9px var(--body);letter-spacing:.12em;color:var(--muted)}.summary{display:flex;gap:1px;margin-bottom:18px;background:var(--line);border:1px solid var(--line)}.summary div{flex:1;padding:11px 13px;background:var(--panel)}.summary b{display:block;font:700 21px var(--display);color:var(--accent)}.summary span{font-size:9px;color:var(--muted);letter-spacing:.08em}.cards{display:grid;gap:9px}.card{width:100%;display:grid;grid-template-columns:92px 1fr 90px;gap:15px;padding:17px;text-align:left;color:var(--ink);background:linear-gradient(110deg,var(--panel),#0e1727);border:1px solid var(--line);border-left:3px solid var(--primary);cursor:pointer;transition:.18s ease}.card:hover,.card.on{transform:translateX(3px);border-color:#506588;background:var(--panel2)}.avatar{width:72px;height:72px;display:grid;place-items:center;border-radius:50%;font:700 24px var(--display);color:#071019;background:linear-gradient(135deg,var(--accent),var(--primary))}.card .kind{color:var(--accent);font-size:9px;letter-spacing:.1em}.card h2{margin:4px 0 6px;font:700 18px/1.25 var(--display)}.card p{margin:0;color:#aebbd0;font-size:12px;line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{padding:2px 6px;border:1px solid var(--line);color:var(--muted);font-size:9px}.amount{text-align:right}.amount b{display:block;color:var(--green);font:700 20px var(--display)}.amount span{font-size:9px;color:var(--muted)}.confidence{margin-top:18px;height:4px;background:#25334a}.confidence i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent))}.detail{padding:22px;border-left:1px solid var(--line);background:rgba(15,24,40,.92);overflow:auto}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.detail-head{padding-bottom:18px;border-bottom:1px solid var(--line)}.detail-head .person{color:var(--accent);font-size:11px}.detail-head h2{margin:7px 0;font:700 27px/1.15 var(--display)}.detail-head p{margin:0;color:var(--muted);font-size:12px}.capital{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.capital div{padding:12px;background:#0c1524;border:1px solid var(--line)}.capital span{display:block;color:var(--muted);font-size:9px}.capital b{font:700 16px var(--display)}.capital .active{border-color:#327080}.capital .active b{color:var(--accent)}.fact{margin:12px 0;padding:14px;border-left:3px solid var(--green);background:#0d1d1a}.fact.warn{border-color:var(--amber);background:#211c10}.fact label{display:block;color:var(--green);font-size:9px;letter-spacing:.12em}.fact.warn label{color:var(--amber)}.fact p{margin:6px 0 0;color:#cbd6e5;font-size:12px;line-height:1.65}.evidence{display:grid;gap:7px}.evidence a{display:grid;grid-template-columns:58px 1fr auto;gap:9px;padding:10px;color:var(--ink);text-decoration:none;background:#0c1524;border:1px solid var(--line)}.evidence a:hover{border-color:var(--accent)}.grade{color:var(--green);font-weight:700}.score{font:700 13px var(--display);color:var(--accent)}.not-used{padding:12px;background:#1d1218;border:1px solid #4c2632;color:#d7a3b2;font-size:11px;line-height:1.6}.back{color:var(--muted);text-decoration:none;font-size:11px}.back:hover{color:var(--accent)}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.detail{position:fixed;right:0;top:58px;bottom:0;width:min(520px,92vw);z-index:8;box-shadow:-20px 0 60px rgba(0,0,0,.45)}.detail.empty{display:none}}@media(max-width:720px){.top nav{display:none}.layout{display:block}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side h3,.threshold,.principle{display:none}.filter{width:auto;flex:0 0 auto}.feed{padding:20px 12px}.hero{grid-template-columns:1fr}.zero{text-align:left}.card{grid-template-columns:58px 1fr}.avatar{width:50px;height:50px}.amount{grid-column:2;text-align:left}.summary{overflow:auto}.summary div{min-width:120px}}
</style></head><body>
<header class="top"><div class="brand">NEWSDESK<small>ACTION INTELLIGENCE</small></div><nav><button class="on" data-view="people">按人物</button><button data-view="themes">按主题 / 地区</button></nav><span class="prototype">FRONTEND DEMO · 非实时数据</span><span class="spacer"></span><a class="back" href="/">返回新闻终端 ↗</a></header>
<main class="layout"><aside class="side"><h3>重点人物</h3><button class="filter on" data-person="all">全部行动 <em>4</em></button><button class="filter" data-person="buffett">Warren Buffett <em>1</em></button><button class="filter" data-person="altman">Sam Altman <em>1</em></button><button class="filter" data-person="musk">Elon Musk <em>1</em></button><button class="filter" data-person="zuckerberg">Mark Zuckerberg <em>1</em></button><h3>主题镜头</h3><button class="filter" data-theme="ai">AI 基础设施 <em>2</em></button><button class="filter" data-theme="energy">能源 / 算力 <em>1</em></button><button class="filter" data-theme="japan">日本资产 <em>1</em></button><h3>物质性门槛</h3><div class="threshold"><input id="threshold" type="range" min="0" max="3" value="1"><div><span>全部</span><b id="threshold-label">≥ 1 亿美元</b></div></div><div class="principle"><b>主规则</b><br>言论权重 = 0。只有资本、合同、产能、组织和正式任职变化进入主流。</div></aside><section class="feed"><div class="hero"><div><div class="eyebrow">Observe allocation, not narration</div><h1>看大佬们<br>做什么。</h1><p>同一句话可以说很多次，资本只能配置一次。这里不展示采访金句，只展示达到门槛、能回到原始证据的行动。</p></div><div class="zero">0<span>言论进入主流的权重</span></div></div><div class="summary"><div><b id="visible-count">4</b><span>高物质性行动</span></div><div><b>4/4</b><span>证据可回溯</span></div><div><b>2</b><span>个人资本行动</span></div><div><b>2</b><span>控制机构配置</span></div></div><div class="cards" id="cards"></div></section><aside class="detail empty" id="detail">选择一条行动<br>查看真金白银、证据与推断边界</aside></main>
<script>
const actions=[
{id:'buffett-japan',person:'buffett',name:'Warren Buffett',initials:'WB',kind:'个人影响下的机构资本',title:'Berkshire 建立日本五大商社长期持仓',summary:'Berkshire 披露对伊藤忠、丸红、三菱商事、三井物产和住友商事分别持有超过 5% 的股份。',amount:'各 >5%',amountNote:'公开持股比例',level:2,themes:['japan'],tags:['资本配置','日本','长期持有'],personal:false,controlled:true,confidence:95,fact:'2020 年公开披露时，Berkshire 表示相关股份约在此前 12 个月内通过东京证券交易所常规买入。',inference:'2011 年访日可作为历史背景，但没有证据证明该访问直接导致多年后的建仓。',sources:[['A','Berkshire Hathaway 公告','https://www.berkshirehathaway.com/news/aug3020.pdf'],['B','独立财经媒体交叉报道','https://www.reuters.com/']]},
{id:'altman-helion',person:'altman',name:'Sam Altman',initials:'SA',kind:'个人资本',title:'向核聚变公司 Helion 投入大额个人资本',summary:'这类行动比其对能源未来的公开表态更有信号，因为它暴露了个人资本的真实风险承担。',amount:'$375M',amountNote:'媒体披露的个人投资',level:3,themes:['energy','ai'],tags:['个人资本','核聚变','能源'],personal:true,controlled:false,confidence:78,fact:'公开报道将这笔投资描述为 Altman 最大的个人投资之一；正式产品仍需核对公司文件和融资记录。',inference:'它支持“Altman 认为能源是 AI 扩张约束”的判断，但不能证明某条具体预测必然成立。',sources:[['B','Helion / 融资公开材料','https://www.helionenergy.com/'],['B','独立媒体交叉报道','https://www.wsj.com/']]},
{id:'musk-twitter',person:'musk',name:'Elon Musk',initials:'EM',kind:'个人资本 + 融资',title:'完成约 440 亿美元 Twitter 收购',summary:'忽略其社交媒体言论，收购资金结构、股权承诺、债务融资和后续组织调整才是有效行动信号。',amount:'$44B',amountNote:'交易总价值',level:3,themes:['ai'],tags:['并购','个人资本','组织控制'],personal:true,controlled:true,confidence:98,fact:'交易完成、控制权转移和融资结构均有公司及监管文件记录。',inference:'该行动证明其愿意为平台控制权承担巨大资本风险；不等于其所有公开产品叙事都可信。',sources:[['A','SEC 交易与公司文件','https://www.sec.gov/edgar/browse/?CIK=1418091'],['B','交易完成独立报道','https://www.reuters.com/']]},
{id:'zuck-capex',person:'zuckerberg',name:'Mark Zuckerberg',initials:'MZ',kind:'控制机构资本',title:'Meta 将数百亿美元资本开支集中到 AI 基础设施',summary:'重点不是“AI 很重要”的表态，而是数据中心、服务器、芯片、折旧和员工结构的实际变化。',amount:'$60–65B',amountNote:'2025 年资本开支指引',level:3,themes:['ai'],tags:['机构资本','数据中心','算力'],personal:false,controlled:true,confidence:94,fact:'Meta 在投资者材料中给出年度资本开支指引，主要驱动力包括生成式 AI 和核心业务基础设施。',inference:'资本开支说明资源配置方向，但不能单独证明投入回报或技术领先。',sources:[['A','Meta Investor Relations','https://investor.atmeta.com/'],['A-','财报与电话会材料','https://investor.atmeta.com/financials/']]}
];let person='all',theme='',threshold=1,selected='';const cards=document.querySelector('#cards'),detail=document.querySelector('#detail');function visible(){return actions.filter(x=>(person==='all'||x.person===person)&&(!theme||x.themes.includes(theme))&&x.level>=threshold)}function render(){const rows=visible();document.querySelector('#visible-count').textContent=rows.length;cards.innerHTML=rows.map(x=>`<button class="card ${selected===x.id?'on':''}" data-id="${x.id}"><div class="avatar">${x.initials}</div><div><span class="kind">${x.kind}</span><h2>${x.title}</h2><p>${x.summary}</p><div class="chips">${x.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div><div class="amount"><b>${x.amount}</b><span>${x.amountNote}</span><div class="confidence"><i style="width:${x.confidence}%"></i></div><span>行动可信度 ${x.confidence}</span></div></button>`).join('')||'<div class="empty">当前门槛下没有行动</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id))}function show(id){selected=id;render();const x=actions.find(a=>a.id===id);detail.className='detail';detail.innerHTML=`<div class="detail-head"><span class="person">${x.name} · ${x.kind}</span><h2>${x.title}</h2><p>${x.summary}</p></div><div class="capital"><div class="${x.personal?'active':''}"><span>个人真金白银</span><b>${x.personal?'是':'否 / 未证明'}</b></div><div class="${x.controlled?'active':''}"><span>控制机构资本</span><b>${x.controlled?'是':'否'}</b></div></div><div class="fact"><label>已观察事实</label><p>${x.fact}</p></div><div class="fact warn"><label>分析边界</label><p>${x.inference}</p></div><h3>证据账本</h3><div class="evidence">${x.sources.map((s,i)=>`<a href="${s[2]}" target="_blank" rel="noopener"><span class="grade">${s[0]} 级</span><b>${s[1]}</b><span class="score">${i?'交叉':'原件'} ↗</span></a>`).join('')}</div><h3>不会展示什么</h3><div class="not-used">采访金句、社交媒体观点、愿景口号和未经验证的“知情人士”叙事不会进入行动主流。它们最多作为寻找正式证据的线索。</div>`}document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{person=b.dataset.person;theme='';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;person='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.view==='themes'){document.querySelector('[data-theme="ai"]').click()}else{document.querySelector('[data-person="all"]').click()}});document.querySelector('#threshold').oninput=e=>{threshold=+e.target.value;document.querySelector('#threshold-label').textContent=['全部','≥ 1 亿美元','≥ 10 亿美元','≥ 100 亿美元'][threshold];render()};render();show('buffett-japan');
</script></body></html>
