<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEWSDESK｜人物动向</title>
<style>
:root{--bg:#080d17;--panel:#0f1828;--panel2:#142238;--line:#283851;--ink:#e7eef9;--muted:#8fa0b8;--cyan:#22d3ee;--indigo:#818cf8;--green:#4ade80;--amber:#fbbf24;--red:#fb7185;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}button,a,input,select{font:inherit}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:#0a111dcc;position:sticky;top:0;z-index:9;backdrop-filter:blur(12px)}.brand{color:var(--amber);font-weight:800;letter-spacing:.09em}.back{color:var(--muted);text-decoration:none;font-size:12px}.back:hover{color:var(--cyan)}.modes{display:flex;gap:4px;margin-left:18px}.modes button,.filters button{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}.modes button.on,.filters button.on{color:var(--cyan);border-color:#28566c;background:#102534}.spacer{flex:1}.policy{font-size:10px;color:#c9b677;border:1px solid #58491d;background:#211b0d;padding:5px 8px}.layout{display:grid;grid-template-columns:380px minmax(430px,1fr) minmax(360px,500px);min-height:calc(100vh - 58px)}.filters{border-right:1px solid var(--line);padding:18px 13px;background:#0b1320;overflow:auto;max-height:calc(100vh - 58px)}.filters h3,.detail h3{margin:18px 7px 7px;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.filters h3:first-child{margin-top:0}.filters button{width:100%;display:flex;justify-content:space-between;text-align:left}.filters button.on{box-shadow:inset 3px 0 var(--cyan)}.filters em{font-style:normal;font-size:10px}.person-browser{display:grid;grid-template-columns:145px 1fr;gap:8px;min-height:260px}.category-list{padding-right:8px;border-right:1px solid var(--line)}.category-list button{font-size:11px;margin-bottom:3px}.category-list small{display:block;margin:2px 0 10px;padding:0 10px;color:#607087;font-size:9px;line-height:1.4}.person-list{min-width:0}.person-list>span{display:block;padding:7px 10px;color:#65758c;font-size:9px;letter-spacing:.06em}.filters .pending-person{color:#65758c}.filters .pending-person em{color:#806f43}.stream{padding:25px 22px;overflow:auto}.hero{margin-bottom:18px}.hero small{color:var(--cyan);letter-spacing:.14em}.hero h1{font-size:clamp(30px,4vw,55px);line-height:1;margin:7px 0}.hero p{color:var(--muted);line-height:1.7;max-width:760px}.statusline{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:12px 0}.coverage-warning{color:var(--amber)}.card{width:100%;display:grid;grid-template-columns:1fr 110px;gap:14px;text-align:left;padding:17px;margin:8px 0;color:var(--ink);background:linear-gradient(110deg,var(--panel),#0b1422);border:1px solid var(--line);border-left:3px solid var(--indigo);cursor:pointer}.card:hover,.card.on{border-color:#4a6282;transform:translateX(2px)}.card h2{font-size:18px;margin:4px 0 8px}.card p{margin:0;color:#b0bfd2;line-height:1.55;font-size:12px}.meta,.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:9px;border:1px solid var(--line);padding:2px 6px;color:var(--muted)}.metric{text-align:right}.metric b{display:block;font-size:24px;color:var(--green)}.metric span{font-size:9px;color:var(--muted)}.detail{border-left:1px solid var(--line);padding:21px;background:#0e1726;overflow:auto}.detail.empty,.empty{display:grid;place-items:center;min-height:220px;color:var(--muted);text-align:center}.detail-head h2{font-size:27px;line-height:1.15;margin:7px 0}.detail-head p{color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.split div,.fact{padding:12px;background:#0a1320;border:1px solid var(--line)}.split span,.fact label{display:block;font-size:9px;color:var(--muted)}.split b{color:var(--cyan)}.fact{margin:9px 0;border-left:3px solid var(--green)}.fact.boundary{border-left-color:var(--amber)}.fact p{font-size:12px;line-height:1.65;margin:6px 0 0}.evidence a{display:grid;grid-template-columns:90px 1fr auto;gap:8px;margin:6px 0;padding:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:#09121f}.evidence a:hover{border-color:var(--cyan)}.evidence span{font-size:10px;color:var(--muted)}.close{display:none}.notice{padding:15px;border:1px dashed #46566e;color:var(--muted);line-height:1.7}.error{color:var(--red)}
@media(max-width:1180px){.layout{grid-template-columns:330px 1fr}.detail{position:fixed;top:58px;right:0;bottom:0;width:min(510px,94vw);z-index:8;box-shadow:-20px 0 70px #0009}.detail.empty{display:none}.close{display:block;float:right;background:transparent;border:1px solid var(--line);color:var(--ink);padding:5px 9px}}@media(max-width:700px){.top{overflow-x:auto}.policy{display:none}.layout{display:block}.filters{max-height:none;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.filters h3{display:none}.person-browser{grid-template-columns:125px minmax(190px,1fr);min-width:330px;min-height:0}.filters{overflow-x:auto}.filters button{white-space:nowrap}.stream{padding:18px 12px}.card{grid-template-columns:1fr}.metric{text-align:left}.detail{width:100%}}
.trend-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 20px}.trend-card{padding:12px;border:1px solid var(--line);background:var(--panel)}.trend-card strong{display:block;margin:4px 0;font-size:15px}.trend-card b{color:var(--cyan);font-size:22px}.trend-card span{color:var(--muted);font-size:10px}.trend-card.collective{border-top:2px solid var(--green)}.trend-card.converging{border-top:2px solid var(--amber)}
.time-section{margin:18px 0 30px}.time-section>header{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;padding:0 3px 8px;border-bottom:1px solid var(--line)}.time-section>header h2{margin:0;font-size:16px}.time-section>header span{color:var(--muted);font-size:10px}.time-section>header b{color:var(--cyan);font-size:18px}
@media(max-width:700px){.trend-grid{grid-template-columns:1fr 1fr}}
#btn-triage{margin-left:6px;border:1px solid #4a3a1d;background:#1b1608;color:var(--amber)}#btn-triage.on{background:#2a2110;border-color:#7a6320;color:#ffd873}#btn-triage em{font-style:normal;font-size:10px;background:#3a2f12;color:#ffd873;padding:1px 6px;border-radius:8px}
.triage-intro{border:1px dashed #4a3a1d;background:#161206;color:#d8c48a;padding:13px 15px;line-height:1.7;margin-bottom:14px;font-size:12px}.triage-intro b{color:var(--amber)}
.tcard{border:1px solid var(--line);border-left:3px solid var(--amber);background:linear-gradient(110deg,var(--panel),#0b1422);padding:15px 17px;margin:9px 0}.tcard h2{font-size:16px;margin:5px 0 7px}.tcard p{margin:4px 0;color:#b0bfd2;font-size:12px;line-height:1.55}.tcard .obs{color:#8fa0b8;font-size:11px;border-left:2px solid var(--line);padding-left:9px;margin:8px 0}.tcard .tev{margin:7px 0;font-size:11px}.tcard .tev a{color:var(--cyan);text-decoration:none}.tcard .tev a:hover{text-decoration:underline}.tcard .tev .role{display:inline-block;min-width:130px;color:var(--muted)}.tacts{display:flex;gap:8px;margin-top:12px}.tacts button{padding:7px 15px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}.tacts .pub{border-color:#2f6b3a;color:#7fe0a0}.tacts .pub:hover{background:#0f2417}.tacts .rej{border-color:#6b2f36;color:#f090a0}.tacts .rej:hover{background:#241014}.tacts button:disabled{opacity:.5;cursor:wait}.tmsg{font-size:11px;margin-top:8px}.tmsg.ok{color:var(--green)}.tmsg.err{color:var(--red)}
</style>
</head>
<body>
<header class="top"><a class="back" href="/">← 主终端</a><span class="brand">NEWSDESK</span><div class="modes"><button class="on" data-view="ledger" data-period="recent">近期动态</button><button data-view="ledger" data-period="history">完整历史</button><button id="btn-triage" data-view="triage" title="管理员分诊：把规则抽取的候选发布或拒绝">分诊队列 <em id="triage-count"></em></button></div><div class="spacer"></div><span class="policy">只看行动 · 言论权重 0 · 不追踪私人实时位置</span></header>
<main class="layout"><aside class="filters"><h3>人物</h3><div class="person-browser"><div class="category-list" id="person-categories"></div><div class="person-list" id="people"></div></div><h3>主题</h3><div id="themes"></div></aside><section class="stream"><div class="hero"><small>OBSERVE ALLOCATION, NOT NARRATION</small><h1 id="lens-title">看他们做什么。</h1><p id="lens-copy">只记录能回到公开证据的资本、并购、产能、合同和组织行动。机构资本不会写成个人出资；计划、宣布与完成严格分开。</p></div><div class="statusline"><b id="count">加载中…</b><span id="mode-note"></span><span id="monitor-status"></span></div><div class="trend-grid" id="trends"></div><div id="cards"></div></section><aside class="detail empty" id="detail">选择一条行动<br>查看资本归属、事实边界与逐项证据</aside></main>
<script src="/static/movements.js"></script></body></html>
