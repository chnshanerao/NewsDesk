<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEWSDESK｜人物动向</title>
<style>
:root{--bg:#080d17;--panel:#0f1828;--panel2:#142238;--line:#283851;--ink:#e7eef9;--muted:#8fa0b8;--cyan:#22d3ee;--indigo:#818cf8;--green:#4ade80;--amber:#fbbf24;--red:#fb7185;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}button,a,input,select{font:inherit}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:#0a111dcc;position:sticky;top:0;z-index:9;backdrop-filter:blur(12px)}.brand{color:var(--amber);font-weight:800;letter-spacing:.09em}.back{color:var(--muted);text-decoration:none;font-size:12px}.back:hover{color:var(--cyan)}.modes{display:flex;gap:4px;margin-left:18px}.modes button,.filters button{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}.modes button.on,.filters button.on{color:var(--cyan);border-color:#28566c;background:#102534}.spacer{flex:1}.policy{font-size:10px;color:#c9b677;border:1px solid #58491d;background:#211b0d;padding:5px 8px}.layout{display:grid;grid-template-columns:220px minmax(430px,1fr) minmax(360px,500px);min-height:calc(100vh - 58px)}.filters{border-right:1px solid var(--line);padding:18px 13px;background:#0b1320}.filters h3,.detail h3{margin:18px 7px 7px;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.filters h3:first-child{margin-top:0}.filters button{width:100%;display:flex;justify-content:space-between;text-align:left}.filters button.on{box-shadow:inset 3px 0 var(--cyan)}.filters em{font-style:normal;font-size:10px}.stream{padding:25px 22px;overflow:auto}.hero{margin-bottom:18px}.hero small{color:var(--cyan);letter-spacing:.14em}.hero h1{font-size:clamp(30px,4vw,55px);line-height:1;margin:7px 0}.hero p{color:var(--muted);line-height:1.7;max-width:760px}.statusline{display:flex;gap:10px;color:var(--muted);font-size:11px;margin:12px 0}.card{width:100%;display:grid;grid-template-columns:1fr 110px;gap:14px;text-align:left;padding:17px;margin:8px 0;color:var(--ink);background:linear-gradient(110deg,var(--panel),#0b1422);border:1px solid var(--line);border-left:3px solid var(--indigo);cursor:pointer}.card:hover,.card.on{border-color:#4a6282;transform:translateX(2px)}.card h2{font-size:18px;margin:4px 0 8px}.card p{margin:0;color:#b0bfd2;line-height:1.55;font-size:12px}.meta,.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:9px;border:1px solid var(--line);padding:2px 6px;color:var(--muted)}.metric{text-align:right}.metric b{display:block;font-size:24px;color:var(--green)}.metric span{font-size:9px;color:var(--muted)}.detail{border-left:1px solid var(--line);padding:21px;background:#0e1726;overflow:auto}.detail.empty,.empty{display:grid;place-items:center;min-height:220px;color:var(--muted);text-align:center}.detail-head h2{font-size:27px;line-height:1.15;margin:7px 0}.detail-head p{color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.split div,.fact{padding:12px;background:#0a1320;border:1px solid var(--line)}.split span,.fact label{display:block;font-size:9px;color:var(--muted)}.split b{color:var(--cyan)}.fact{margin:9px 0;border-left:3px solid var(--green)}.fact.boundary{border-left-color:var(--amber)}.fact p{font-size:12px;line-height:1.65;margin:6px 0 0}.evidence a{display:grid;grid-template-columns:90px 1fr auto;gap:8px;margin:6px 0;padding:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:#09121f}.evidence a:hover{border-color:var(--cyan)}.evidence span{font-size:10px;color:var(--muted)}.close{display:none}.notice{padding:15px;border:1px dashed #46566e;color:var(--muted);line-height:1.7}.error{color:var(--red)}
@media(max-width:1080px){.layout{grid-template-columns:190px 1fr}.detail{position:fixed;top:58px;right:0;bottom:0;width:min(510px,94vw);z-index:8;box-shadow:-20px 0 70px #0009}.detail.empty{display:none}.close{display:block;float:right;background:transparent;border:1px solid var(--line);color:var(--ink);padding:5px 9px}}@media(max-width:700px){.top{overflow-x:auto}.policy{display:none}.layout{display:block}.filters{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.filters h3{display:none}.filters button{width:auto;white-space:nowrap}.stream{padding:18px 12px}.card{grid-template-columns:1fr}.metric{text-align:left}.detail{width:100%}}
</style>
</head>
<body>
<header class="top"><a class="back" href="/">← 主终端</a><span class="brand">NEWSDESK</span><div class="modes"><button class="on" data-workflow="published">已发布行动</button></div><div class="spacer"></div><span class="policy">只看行动 · 言论权重 0 · 不追踪私人实时位置</span></header>
<main class="layout"><aside class="filters"><h3>人物</h3><button class="on" data-person="">全部人物 <em id="people-total">—</em></button><div id="people"></div><h3>主题</h3><div id="themes"></div></aside><section class="stream"><div class="hero"><small>OBSERVE ALLOCATION, NOT NARRATION</small><h1>看他们做什么。</h1><p>只记录能回到公开证据的资本、并购、产能、合同和组织行动。机构资本不会写成个人出资；计划、宣布与完成严格分开。</p></div><div class="statusline"><b id="count">加载中…</b><span id="mode-note"></span></div><div id="cards"></div></section><aside class="detail empty" id="detail">选择一条行动<br>查看资本归属、事实边界与逐项证据</aside></main>
<script src="/static/movements.js"></script></body></html>
