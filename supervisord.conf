[supervisord]
nodaemon=false
umask=077
pidfile=/tmp/newsdesk-supervisord.pid
logfile=/tmp/newsdesk-supervisord.log
childlogdir=/tmp

[unix_http_server]
file=/tmp/newsdesk-supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/newsdesk-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:newsdesk]
umask=077
command=/home/admin/workspace/8.workers/news-terminal/bin/newsdesk serve --host 0.0.0.0 -p 18999
directory=/home/admin/workspace/8.workers/news-terminal
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/home/admin/workspace/8.workers/news-terminal/data/logs/newsdesk-18999.log
stderr_logfile=/home/admin/workspace/8.workers/news-terminal/data/logs/newsdesk-18999.err
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
